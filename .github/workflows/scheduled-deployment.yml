name: Scheduled Monthly Deploy

on:
  schedule:
    - cron: '0 10 1 * *'  # 1st of each month at 10:00 UTC
  workflow_dispatch:      # allow manual trigger too

jobs:
  create-release-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: develop
          fetch-depth: 0
          # Do not leave any credentials in .git/config for the rest of the job.
          # The repository is public, so `git fetch` below needs no auth at all,
          # and the single step that needs write access authenticates explicitly.
          persist-credentials: false

      - name: Check for diff
        id: diff
        run: |
          git fetch origin main
          COUNT=$(git rev-list origin/main..HEAD --count)
          echo "ahead=$COUNT" >> $GITHUB_OUTPUT

      - name: Bump version and Commit
        if: steps.diff.outputs.ahead != '0'
        id: version-bump
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          CURRENT_VERSION=$(grep '^version = "' build.gradle.kts | cut -d '"' -f 2)
          V_YEAR=$(echo $CURRENT_VERSION | cut -d '.' -f 1)
          V_MINOR=$(echo $CURRENT_VERSION | cut -d '.' -f 2)
          
          CURRENT_YEAR=$(date +%Y)
          
          if [ "$CURRENT_YEAR" -gt "$V_YEAR" ]; then
            NEW_VERSION="$CURRENT_YEAR.0.0"
          else
            NEW_MINOR=$((V_MINOR + 1))
            NEW_VERSION="$V_YEAR.$NEW_MINOR.0"
          fi
          
          echo "Bumping version from $CURRENT_VERSION to $NEW_VERSION"
          sed -i "s/version = \"$CURRENT_VERSION\"/version = \"$NEW_VERSION\"/" build.gradle.kts
          
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: bump version to $NEW_VERSION"

          # Push with the PAT rather than GITHUB_TOKEN: a push made by GITHUB_TOKEN
          # does not trigger any further workflow, so the release PR would never get
          # its `synchronize` event and Check and Build would not run on it. Passed
          # inline instead of via actions/checkout so the credential is scoped to
          # this one command and never lands in .git/config.
          git push "https://x-access-token:${RELEASE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:develop

          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: steps.diff.outputs.ahead != '0'
        id: create-pr
        env:
          # Same reason as above: a PR opened with GITHUB_TOKEN does not trigger the
          # `pull_request` event, so its required checks would never report and the
          # PR would stay blocked forever.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          NEW_VERSION=${{ steps.version-bump.outputs.new_version }}
          
          # Check if PR already exists
          PR_EXISTS=$(gh pr list --head develop --base main --state open --json number -q '.[0].number')
          
          if [ -z "$PR_EXISTS" ]; then
            PR_URL=$(gh pr create \
              --base main \
              --head develop \
              --title "$NEW_VERSION" \
              --body "## Automated Monthly Release
            - New Version: \`$NEW_VERSION\`
            - Triggered: \`${{ github.event_name }}\`
            - Run: \`${{ github.run_number }}\`" \
              --label auto-release)
          else
            echo "PR already exists: $PR_EXISTS"
            gh pr edit "$PR_EXISTS" --title "$NEW_VERSION"
            PR_URL=$(gh pr view "$PR_EXISTS" --json url -q ".url")
          fi
          
          echo "pull-request-url=$PR_URL" >> $GITHUB_OUTPUT

      # No repository_dispatch fallback anymore: it only existed to get Check and
      # Build to run for a PR opened by GITHUB_TOKEN. Since the PR is now opened with
      # the PAT, the regular `pull_request` event does that - and the dispatched run
      # shared a concurrency group with the PR run, so the two cancelled each other.

      - name: Enable Auto-Merge
        if: steps.create-pr.outputs.pull-request-url
        run: |
          gh pr merge ${{ steps.create-pr.outputs.pull-request-url }} \
            --auto --merge
        env:
          # Must NOT be the default GITHUB_TOKEN: pushes made by GITHUB_TOKEN do
          # not trigger further workflows, so the merge to main would never fire
          # publish.yml and the site would not deploy. Using a fine-grained PAT
          # (or GitHub App installation token) makes the merge push trigger
          # publish.yml -> Deploy as expected.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}