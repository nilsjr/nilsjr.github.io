name: Check and Build
on:
  # pull_request only. `develop` is both the default branch and the head branch of the
  # monthly release PR, so a `push`/`repository_dispatch` trigger produces a *second*
  # run on the exact same commit as the release PR's run. Both runs land in the same
  # concurrency group and cancel each other, which leaves cancelled (= blocking)
  # required check runs on the PR head commit and stops auto-merge.
  # Nothing goes unchecked: a commit either arrives via a PR against develop, or it
  # lands on develop while the release PR is open, which fires `synchronize`.
  pull_request:
    branches:
      - main
      - develop

concurrency:
  # One run per pull request. Keyed on the PR number instead of the branch name, so
  # runs of different PRs can never cancel each other - notably a feature PR into
  # develop vs. the release PR that has develop as its head branch.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  detekt:
    name: Run detekt & ktlintCheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: Run detekt with ktlint
        run: ./gradlew detekt ktlintCheck

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: Test and Build
        run: ./gradlew build
      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

  lighthouse:
    name: Lighthouse budgets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: Build production distribution
        run: ./gradlew jsBrowserDistribution
      - name: Serve production build
        run: node ci/gzip-server.cjs build/dist/js/productionExecutable 8137 &
      - name: Wait for server
        run: npx wait-on http://127.0.0.1:8137 --timeout 30000
      - name: Run Lighthouse and assert budgets
        run: node ci/assert-lighthouse-budgets.cjs
